name: Test PowerShell

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path . -Recurse -File | Where-Object { $_.Extension -in '.ps1', '.psm1' -or $_.Name -eq 'r' }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "::error file=$($file.FullName)::PowerShell parse errors found"
              $errors | Format-List | Out-String | Write-Host
              throw "PowerShell parse failed for $($file.FullName)"
            }
            Write-Host "OK $($file.FullName)"
          }

      - name: Test one-time launcher (no hardware load)
        shell: powershell
        run: .\tests\Bootstrap.Tests.ps1

      - name: Test component-aware diagnostic evidence (offline)
        shell: powershell
        run: .\tests\PCDiagLite.Tests.ps1

      - name: Test PCDiagLite restart/shutdown classification (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\PCDiagLite.RestartShutdown.Tests.ps1

      - name: Test PCDiagLite restart/shutdown classification (PowerShell 7)
        shell: pwsh
        run: .\tests\PCDiagLite.RestartShutdown.Tests.ps1

      - name: Validate manifest JSON
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -Raw -Path manifest.json | ConvertFrom-Json
          foreach ($tool in $manifest.tools) {
            if (-not (Test-Path -LiteralPath $tool.path)) {
              throw "Manifest tool path not found: $($tool.path)"
            }
          }
          Write-Host "Manifest OK"

  telemetry-smoke:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Telemetry load path (Windows PowerShell 5.1, net472 build)
        shell: powershell
        run: .\tests\HardwareStability\Telemetry.Smoke.ps1

      - name: Telemetry load path (PowerShell 7, netstandard2.0 build)
        shell: pwsh
        run: .\tests\HardwareStability\Telemetry.Smoke.ps1 -ToolCacheRoot "$env:RUNNER_TEMP\telemetry-pwsh"

      - name: PawnIO driver install (throwaway runner) and telemetry with it (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\HardwareStability\Telemetry.Smoke.ps1 -InstallPawnIO -ToolCacheRoot "$env:RUNNER_TEMP\telemetry-pawnio"

  hardware-stability-fixtures:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fixture suite (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\HardwareStability\HardwareStability.Fixtures.Tests.ps1

      - name: Fixture suite (PowerShell 7)
        shell: pwsh
        run: .\tests\HardwareStability\HardwareStability.Fixtures.Tests.ps1

  hardware-stability-end-to-end:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Real run with shortened stages and automatic retest (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\HardwareStability\EndToEnd.Smoke.ps1 -OutputRoot "$env:RUNNER_TEMP\hs-e2e"
